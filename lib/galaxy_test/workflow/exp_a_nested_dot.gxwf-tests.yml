- doc: optional input provided -> nested-conditional gated step runs
  job:
    fallback:
      class: File
      contents: "FALLBACK"
      filetype: tabular
    maybe:
      class: File
      contents: "PROVIDED"
      filetype: tabular
  outputs:
    out:
      class: File
      asserts:
        - that: has_text
          text: "PROVIDED"
- doc: optional input omitted -> nested-conditional gated step skipped
  job:
    fallback:
      class: File
      contents: "FALLBACK"
      filetype: tabular
  outputs:
    out:
      class: File
      asserts:
        - that: has_text
          text: "FALLBACK"
