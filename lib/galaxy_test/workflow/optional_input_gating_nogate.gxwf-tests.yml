- doc: |
    Optional input supplied - an ungated step consuming it runs normally. Nothing
    about the connection itself is rejected.
  job:
    maybe:
      class: File
      contents: "PROVIDED"
      filetype: txt
  outputs:
    out:
      class: File
      asserts:
        - that: has_text
          text: "PROVIDED"
- doc: |
    Optional input omitted with no gate - the invocation fails. Tool request state is
    validation_failed and the job errors with "Parameter 'input1': specify a dataset
    of the required format". This proves the skip in the gated fixtures comes from the
    when expression rather than from implicit null propagation.
  expect_failure: true
  job: {}
  outputs:
    out:
      class: File
      asserts:
        - that: has_text
          text: "PROVIDED"
