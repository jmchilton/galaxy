- doc: |
    TYPE_PREFIX_MAPPED: A list:paired input maps over the paired input of a
    type_source output with type_prefix list, yielding a list:list:paired output.
  job:
    input1:
      class: Collection
      collection_type: list:paired
      elements:
        - identifier: el1
          class: Collection
          elements:
            - identifier: forward
              class: File
              contents: "forward content"
            - identifier: reverse
              class: File
              contents: "reverse content"
  outputs:
    wf_output:
      class: Collection
      collection_type: list:list:paired
      elements:
        el1:
          class: Collection
          elements:
            first:
              class: Collection
              elements:
                forward:
                  asserts:
                    - that: has_text
                      text: "forward content"
                reverse:
                  asserts:
                    - that: has_text
                      text: "reverse content"
            second:
              class: Collection
              elements:
                forward:
                  asserts:
                    - that: has_text
                      text: "forward content"
                reverse:
                  asserts:
                    - that: has_text
                      text: "reverse content"
