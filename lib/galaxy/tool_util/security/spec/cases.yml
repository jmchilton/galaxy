# Cases of the tool security review. See __init__.py for the format.
#
# Red jobs carry a value that leaves its place in the template; with `harm: true` the runner also
# builds their command with the review off and checks that it creates `harm-marker`. Green jobs are
# the nearest values the review must let through.

raw_text_shell_injection:
  doc: A text value written past its sanitizer can close its single quotes and start a command.
  tool: raw_text_single_quoted.xml
  code: shell-injection
  review:
    serious_rules: [shell-injection]
    findings:
      - {rule: shell-injection, severity: high, accessor: raw, param: word, checkable: true}
  red:
    - inputs: {word: "a';touch harm-marker;'"}
      harm: true
      expect:
        rejected: true
        message_contains: ["the value of input 'word' contains the characters [' ;]"]
  green:
    - doc: Command characters stay inside the quotes when no quote closes them.
      inputs: {word: "a;b|c && d"}
      harm: true
      expect: {rejected: false}

sanitized_text_stays_quoted:
  doc: The default sanitizer turns quotes into tokens, so a sanitized text value cannot leave its quotes.
  tool: sanitized_text_single_quoted.xml
  review:
    serious_rules: []
  green:
    - inputs: {word: "a';touch harm-marker;'"}
      harm: true
      expect: {rejected: false}

file_param_stays_quoted:
  doc: >-
    A file param is written as Galaxy writes a text param, through its sanitizer, so it cannot leave its
    single quotes.
  tool: file_param_single_quoted.xml
  review:
    serious_rules: []
  green:
    - doc: Galaxy gives the path where it stored the uploaded file.
      inputs: {f: /dev/null}
      harm: true
      expect: {rejected: false}
    - doc: >-
        Quotes and command characters are turned into tokens and stay inside the quotes. No file has the
        name that results, so `cat` fails, but nothing else runs.
      inputs: {f: "a';touch harm-marker;'"}
      expect: {rejected: false}

ftpfile_param_shell_injection:
  doc: An ftpfile param is written as the user's file names, with no sanitizer, and can close its single quotes.
  tool: ftpfile_param_single_quoted.xml
  code: shell-injection
  review:
    serious_rules: [shell-injection]
    findings:
      - {rule: shell-injection, severity: high, accessor: raw, param: f, checkable: true}
  red:
    - inputs: {f: "a';touch harm-marker;'"}
      harm: true
      expect:
        rejected: true
        message_contains: ["the value of input 'f' contains the characters [' ;]"]
  green:
    - inputs: {f: /dev/null}
      harm: true
      expect: {rejected: false}

color_param_validated:
  doc: >-
    Galaxy renders a color param only when it is a colour name, bare hex or `#RRGGBB`, which cannot leave its
    double quotes or begin with a dash.
  tool: color_param_double_quoted.xml
  review:
    serious_rules: []
    absent:
      - {rule: shell-injection, param: col}
      - {rule: option-injection, param: col}
  green:
    - inputs: {col: "#ff0000"}
      harm: true
      expect: {rejected: false}
    - config: {mode: enforce_all}
      inputs: {col: grey}
      expect: {rejected: false}

color_rgb_unquoted_splits:
  doc: With `rgb="true"`, a colour renders as a tuple such as `(255, 0, 0)`, whose spaces split it unquoted.
  tool: color_rgb_unquoted.xml
  code: argument-injection
  review:
    serious_rules: []
    findings:
      - {rule: argument-injection, severity: medium, accessor: text, param: col, checkable: true}
  red:
    - config: {mode: enforce_all}
      inputs: {col: "#ff0000"}
      expect:
        rejected: true
        message_contains: ["the value of input 'col' contains the characters [space ( )]"]
  green:
    - doc: The words hold only digits, commas and parentheses, which `enforce_code` lets through.
      inputs: {col: "#ff0000"}
      expect: {rejected: false}

color_value_validated:
  doc: >-
    `.value` of a color param is the value as it was sent, which Galaxy checks as it evaluates the job, however
    the value reached it.
  tool: color_value_double_quoted.xml
  review:
    serious_rules: []
    absent:
      - {rule: shell-injection, param: col}
  green:
    - inputs: {col: "#FF0000"}
      harm: true
      expect: {rejected: false}

element_identifier_shell_injection:
  doc: Element identifiers are not sanitized; one in single quotes can start a command.
  tool: element_identifier_single_quoted.xml
  code: shell-injection
  review:
    serious_rules: [shell-injection]
    findings:
      - {rule: shell-injection, accessor: element_identifier, param: input, checkable: true}
  red:
    - collections:
        input:
          elements: [{identifier: "a';touch harm-marker;'"}]
      harm: true
      expect:
        rejected: true
        message_contains: ["an element identifier or the name of input 'input' contains the characters [' ;]"]
  green:
    - doc: Spaces, slashes and dots are common in identifiers and stay in place.
      collections:
        input:
          elements: [{identifier: "sample 1/reads.fq"}]
      harm: true
      expect: {rejected: false}
    - doc: >-
        A lone quote only splits arguments, a medium finding the check lets through; the command it
        builds does not parse, which is the tool's bug rather than a way out.
      collections:
        input:
          elements: [{identifier: "Bob's reads"}]
      expect: {rejected: false}

dataset_name_stays_quoted:
  doc: >-
    Outside a collection, the element identifier of a dataset input is its name, which Galaxy sanitizes.
    The review counts it as written as the user set it; the job check reads it as the template does.
  tool: dataset_name_identifier.xml
  review:
    serious_rules: [shell-injection]
    findings:
      - {rule: shell-injection, accessor: element_identifier, param: input, checkable: true}
  green:
    - datasets:
        input: {name: "a';touch harm-marker;'"}
      harm: true
      expect: {rejected: false}

paired_element_attribute_is_a_path:
  doc: >-
    `.forward` of an element of an untyped collection is a dataset path when the element is a pair; a plain
    dataset has no such attribute, and the template fails where it reads one.
  tool: untyped_collection_forward.xml
  review:
    serious_rules: []
    absent:
      - {rule: path-traversal, accessor: dataset_attribute, key: forward}
  green:
    - config: {mode: enforce_data}
      collections:
        c:
          elements: [{identifier: "sample 1"}]
      harm: true
      expect: {rejected: false}

dataset_info_is_user_text:
  doc: The info of a dataset is text the user set, and can hold a path.
  tool: dataset_info_link_name.xml
  code: path-traversal
  review:
    serious_rules: []
    findings:
      - {rule: path-traversal, severity: medium, accessor: dataset_attribute, param: d, key: info, checkable: true}
  red:
    - config: {mode: enforce_data}
      datasets: {d: {info: "../harm-marker"}}
      harm: true
      expect:
        rejected: true
        message_contains: ["contains the characters [/]"]
  green:
    - config: {mode: enforce_data}
      datasets: {d: {info: notes}}
      harm: true
      expect: {rejected: false}

wrapped_names_stay_quoted:
  doc: >-
    Galaxy sanitizes dataset names and metadata read through the dataset wrapper even in a tool that turns
    the sanitizer off. The review counts them as written as users set them; the job check reads them as
    the template does, so these jobs run.
  tool: dataset_name_unsanitized.xml
  review:
    serious_rules: [shell-injection]
    findings:
      - {rule: shell-injection, accessor: dataset_attribute, param: input, key: name, checkable: true}
      - {rule: shell-injection, accessor: metadata, param: input, key: column_names, checkable: true}
  green:
    - datasets:
        input: {name: "a';touch harm-marker;'", ext: tabular, content: "1\t2\n", metadata: {column_names: ["a';touch harm-marker;'"]}}
      harm: true
      expect: {rejected: false}

group_tags_shell_injection:
  doc: Group tags are not sanitized.
  tool: group_tags.xml
  code: shell-injection
  review:
    serious_rules: [shell-injection]
    findings:
      - {rule: shell-injection, accessor: group_tags, param: input, checkable: true}
  red:
    - datasets:
        input: {tags: ["group:a';touch harm-marker;'"]}
      harm: true
      expect:
        rejected: true
        message_contains: ["a group tag of a dataset of input 'input' contains the characters [' ;]"]
  green:
    - doc: Command characters stay inside the quotes when no quote closes them.
      datasets:
        input: {tags: ["group:a;b", "name:sample1"]}
      harm: true
      expect: {rejected: false}

dataset_content_shell_injection:
  doc: A template that reads a dataset with open() writes its content; the check reads the file Galaxy keeps.
  tool: dataset_content_first_line.xml
  code: shell-injection
  review:
    patterns: [file-access]
    serious_rules: [shell-injection]
    findings:
      - {rule: shell-injection, accessor: dataset_content, param: input, checkable: true}
      - {rule: template-file-io}
  red:
    - datasets:
        input: {content: "a';touch harm-marker;'\n"}
      harm: true
      expect:
        rejected: true
        message_contains: ["the content of a dataset of input 'input' contains the characters [' ;]"]
  green:
    - doc: Command characters stay inside the quotes when no quote closes them.
      datasets:
        input: {content: "chr1;100|200\n"}
      harm: true
      expect: {rejected: false}

user_preference_stays_quoted:
  doc: >-
    Unless the tool turns the sanitizer off, Galaxy sanitizes what a template reads from the user object,
    preferences included. The review counts a preference as written as the user set it; the job check reads
    it as the template does, so this job runs.
  tool: user_preference.xml
  review:
    serious_rules: [shell-injection]
    findings:
      - {rule: shell-injection, accessor: user_preference, key: "spec|label", checkable: true}
  green:
    - user: {preferences: {"spec|label": "a';touch harm-marker;'"}}
      harm: true
      expect: {rejected: false}

user_preference_shell_injection:
  doc: >-
    With the sanitizer off, a preference is written as the user set it. Read by name, with a subscript or a
    Cheetah name, it can close its single quotes and start a command.
  tool: user_preference_unsanitized.xml
  code: shell-injection
  review:
    patterns: [user-object]
    serious_rules: [shell-injection]
    findings:
      - {rule: shell-injection, accessor: user_preference, key: "spec|label", checkable: true}
      - {rule: shell-injection, accessor: user_preference, key: label, checkable: true}
  red:
    - user: {preferences: {"spec|label": "a';touch harm-marker;'", label: x}}
      harm: true
      expect:
        rejected: true
        message_contains: ["your preference 'spec|label' contains the characters [' ;]"]
    - user: {preferences: {"spec|label": x, label: "a';touch harm-marker;'"}}
      harm: true
      expect:
        rejected: true
        message_contains: ["your preference 'label' contains the characters [' ;]"]
  green:
    - doc: Command characters stay inside the quotes when no quote closes them.
      user: {preferences: {"spec|label": "a;b|c && d", label: "a;b|c && d"}}
      harm: true
      expect: {rejected: false}

stray_quote:
  doc: >-
    A lone quote in one value is harmless by itself, but it flips the quoting of the rest of the line,
    which leaves the command characters of the next value unquoted.
  tool: stray_quote.xml
  code: stray-quote
  review:
    serious_rules: [shell-injection]
  red:
    - collections:
        input:
          elements: [{identifier: "Bob's reads"}]
      inputs: {word: "x;touch harm-marker;#"}
      harm: true
      expect:
        rejected: true
        message_contains:
          - "the value of input 'word' contains the characters [;]"
          - "an element identifier or the name of input 'input' contains the characters [']"
  green:
    - doc: The same value with no quote before it stays inside its quotes.
      collections:
        input:
          elements: [{identifier: "Bobs reads"}]
      inputs: {word: "x;touch harm-marker;#"}
      harm: true
      expect: {rejected: false}
    - doc: The same lone quote next to a value without command characters.
      collections:
        input:
          elements: [{identifier: "Bob's reads"}]
      inputs: {word: "it's fine"}
      harm: true
      expect: {rejected: false}

nested_shell:
  doc: A value in the program of `bash -c` is shell code again, inside the outer quotes.
  tool: nested_shell.xml
  code: nested-interpreter
  review:
    serious_rules: [nested-interpreter]
    findings:
      - {rule: nested-interpreter, accessor: raw, param: word, checkable: true}
  red:
    - inputs: {word: "a;touch harm-marker"}
      harm: true
      expect:
        rejected: true
        message_contains: ["the value of input 'word' contains the characters [;]"]
  green:
    - inputs: {word: "hello world"}
      harm: true
      expect: {rejected: false}

sed_program:
  doc: A value in a sed program can end the s command and add one that runs a shell command (`e`, GNU sed).
  tool: sed_program.xml
  code: nested-interpreter
  review:
    serious_rules: [nested-interpreter]
  red:
    - inputs: {word: "y/;e touch harm-marker\ns/x/"}
      expect:
        rejected: true
        message_contains: ["the value of input 'word' contains the characters [newline /]"]
  green:
    - inputs: {word: "hello world"}
      harm: true
      expect: {rejected: false}

configfile_python:
  doc: A value in a string of a Python configfile can end the string and add Python code.
  tool: configfile_python.xml
  code: configfile-injection
  review:
    serious_rules: [configfile-injection]
    findings:
      - {rule: configfile-injection, location: "configfile:script", accessor: raw, param: word, checkable: true}
  red:
    - inputs: {word: "';open('harm-marker','w');'"}
      harm: true
      expect:
        rejected: true
        message_contains: ["the value of input 'word' contains the characters [']"]
  green:
    - inputs: {word: "a;b \"c\" $d"}
      harm: true
      expect: {rejected: false}

repr_python_literal:
  doc: >-
    repr() of a string is a Python string literal, with the value's quotes and backslashes escaped. Written as
    code in a Python configfile, outside any string, it stays one string, even for a raw value.
  tool: repr_python_literal.xml
  review:
    serious_rules: []
  green:
    - doc: Quotes and backslashes in the value stay inside the string repr() writes.
      inputs: {raw_word: "a\\'); open('harm-marker', 'w'); ('", word: "a'); open('harm-marker', 'w'); ('"}
      harm: true
      expect: {rejected: false}

repr_inside_python_string:
  doc: >-
    Inside a string, the quotes repr() writes end that string, so even a sanitized value that has no quote of
    its own is then Python code.
  tool: repr_inside_python_string.xml
  code: configfile-injection
  review:
    serious_rules: [configfile-injection]
    findings:
      - {rule: configfile-injection, severity: high, location: "configfile:script", accessor: text, param: word,
         checkable: true}
  red:
    - inputs: {word: "+str(open(chr(104)+chr(97)+chr(114)+chr(109)+chr(45)+chr(109)+chr(97)+chr(114)+chr(107)+chr(101)+chr(114),chr(119)))+"}
      harm: true
      expect:
        rejected: true
        message_contains: ["the value of input 'word' contains the characters [( )]"]
  green:
    - doc: "A value without a call cannot run anything: here the line is `word = '' or ''`."
      inputs: {word: " or "}
      harm: true
      expect: {rejected: false}

repr_closes_shell_single_quotes:
  doc: >-
    repr() writes its own quotes, which end the shell's single quotes around it: the value is then unquoted, and
    the shell splits it into words. With `enforce_data`, a word that can be an option is refused.
  tool: repr_in_shell_single_quotes.xml
  code: argument-injection
  review:
    findings:
      - {rule: argument-injection, severity: medium, accessor: text, param: files, checkable: true}
  red:
    - config: {mode: enforce_data}
      datasets: {input: {name: reads.txt}}
      inputs: {files: "reads.txt -o harm-marker"}
      harm: true
      expect:
        rejected: true
        message_contains: ["the value of input 'files' contains the characters [space a word starting with -]"]
  green:
    - config: {mode: enforce_data}
      datasets: {input: {name: reads.txt}}
      inputs: {files: "reads.txt reads.txt"}
      harm: true
      expect: {rejected: false}
    - doc: With `enforce_code`, the default, words the shell splits are not refused.
      datasets: {input: {name: reads.txt}}
      inputs: {files: "reads.txt -r"}
      expect: {rejected: false}

repr_unquoted_is_one_word:
  doc: Unquoted, the quotes repr() writes keep a sanitized value one shell word.
  tool: repr_in_shell_unquoted.xml
  review:
    absent:
      - {rule: argument-injection, param: files}
  green:
    - config: {mode: enforce_data}
      datasets: {input: {name: reads.txt}}
      inputs: {files: reads.txt}
      harm: true
      expect: {rejected: false}
    - doc: The value is one file name for `sort`, which it does not find; nothing else runs.
      config: {mode: enforce_data}
      datasets: {input: {name: reads.txt}}
      inputs: {files: "reads.txt -o harm-marker"}
      expect: {rejected: false}

json_inside_python_string:
  doc: >-
    json.dumps() of a string writes it between double quotes. Inside a "..." string of a Python configfile,
    those quotes end the string.
  tool: json_inside_python_string.xml
  code: configfile-injection
  review:
    serious_rules: [configfile-injection]
    findings:
      - {rule: configfile-injection, severity: high, location: "configfile:script", accessor: text, param: word,
         checkable: true}
  red:
    - inputs: {word: "+str(open(chr(104)+chr(97)+chr(114)+chr(109)+chr(45)+chr(109)+chr(97)+chr(114)+chr(107)+chr(101)+chr(114),chr(119)))+"}
      harm: true
      expect:
        rejected: true
        message_contains: ["the value of input 'word' contains the characters [( )]"]
  green:
    - doc: 'A value without a call cannot run anything: here the line is `word = "" or ""`.'
      inputs: {word: " or "}
      harm: true
      expect: {rejected: false}

json_inside_fstring:
  doc: >-
    json.dumps() escapes quotes and backslashes but keeps braces. Written as an f-string of a Python configfile,
    braces in the value are an expression the script evaluates.
  tool: json_inside_fstring.xml
  code: configfile-injection
  review:
    serious_rules: [configfile-injection]
    findings:
      - {rule: configfile-injection, severity: high, location: "configfile:script", accessor: raw, param: word,
         checkable: true}
  red:
    - inputs: {word: "{open(chr(104)+chr(97)+chr(114)+chr(109)+chr(45)+chr(109)+chr(97)+chr(114)+chr(107)+chr(101)+chr(114),chr(119))}"}
      harm: true
      expect: {rejected: true}
  green:
    - doc: Quotes and backslashes stay inside the string json.dumps() writes.
      inputs: {word: "a \\\" b"}
      harm: true
      expect: {rejected: false}

json_python_literal_clean:
  doc: >-
    The same json.dumps() written as code outside any string, without the f prefix, is a string literal, even for
    a raw value with braces.
  tool: json_python_literal.xml
  review:
    serious_rules: []
    absent:
      - {rule: configfile-injection, param: word}
  green:
    - inputs: {word: "{open(chr(104)+chr(97)+chr(114)+chr(109)+chr(45)+chr(109)+chr(97)+chr(114)+chr(107)+chr(101)+chr(114),chr(119))}"}
      harm: true
      expect: {rejected: false}

python_os_system_is_shell:
  doc: >-
    A string of a Python configfile that `os.system()` runs is a shell command. A sanitized value cannot end the
    Python string, but the shell splits it into words, which can be options.
  tool: python_os_system.xml
  code: configfile-injection
  review:
    serious_rules: []
    findings:
      - {rule: configfile-injection, severity: medium, location: "configfile:script", accessor: text, param: p,
         checkable: true}
  red:
    - config: {mode: enforce_data}
      inputs: {p: "-o harm-marker"}
      harm: true
      expect:
        rejected: true
        message_contains: ["the value of input 'p' contains the characters [space a word starting with -]"]
  green:
    - config: {mode: enforce_data}
      inputs: {p: words}
      harm: true
      expect: {rejected: false}

python_print_is_not_shell:
  doc: The same value in a string the Python configfile prints stays a string.
  tool: python_print_string.xml
  review:
    serious_rules: []
    absent:
      - {rule: configfile-injection, param: p}
  green:
    - config: {mode: enforce_all}
      inputs: {p: "-o harm-marker"}
      harm: true
      expect: {rejected: false}

python_os_system_raw_value:
  doc: >-
    A raw value that a validator keeps free of single quotes cannot end the Python string `os.system()` runs, but
    the shell that runs the string runs the commands the value adds.
  tool: python_os_system_raw.xml
  code: configfile-injection
  review:
    serious_rules: [configfile-injection]
    findings:
      - {rule: configfile-injection, severity: high, location: "configfile:script", accessor: raw, param: p,
         checkable: true}
  red:
    - inputs: {p: "a; touch harm-marker"}
      harm: true
      expect:
        rejected: true
        message_contains: ["the value of input 'p' contains the characters [;]"]
    - inputs: {p: "$(touch harm-marker)"}
      harm: true
      expect: {rejected: true}
  green:
    - doc: Words the shell splits are refused only from `enforce_data` on.
      inputs: {p: "hello world"}
      harm: true
      expect: {rejected: false}

python_os_system_escapes:
  doc: >-
    A backslash in a value written into a Python string is an escape of that string, which can write any
    character, a quote or `;` too, into the command `os.system()` gives the shell.
  tool: python_os_system_escapes.xml
  code: configfile-injection
  review:
    serious_rules: [configfile-injection]
    findings:
      - {rule: configfile-injection, severity: high, location: "configfile:script", accessor: raw, param: p,
         checkable: true}
  red:
    - inputs: {p: 'x\x27\x3btouch harm\x2dmarker\x3b\x27'}
      harm: true
      expect:
        rejected: true
        message_contains: ["the value of input 'p' contains the characters [a backslash before a character]"]
  green:
    - doc: Without a backslash the value stays inside the shell's single quotes.
      inputs: {p: "hello world"}
      harm: true
      expect: {rejected: false}

conditional_selector_by_subscript_narrows:
  doc: >-
    Testing a conditional's selector as `$c['sel']` restricts its parameters to that case, as `$c.sel` does: there
    the parameter is a select whose options the tool lists, and its raw value is one of them.
  tool: conditional_selector_subscript.xml
  review:
    serious_rules: []
    absent:
      - {rule: shell-injection, param: c.word}
  green:
    - inputs: {c: {sel: fixed, word: a}}
      harm: true
      expect: {rejected: false}
    - doc: In the other case the text is written through its sanitizer.
      inputs: {c: {sel: free, word: "a';touch harm-marker;'"}}
      harm: true
      expect: {rejected: false}

conditional_selector_by_attribute_narrows:
  doc: The same test written as `$c.sel`.
  tool: conditional_selector_attribute.xml
  review:
    serious_rules: []
    absent:
      - {rule: shell-injection, param: c.word}
  green:
    - inputs: {c: {sel: fixed, word: b}}
      harm: true
      expect: {rejected: false}

conditional_selector_by_subscript_keeps_its_case:
  doc: Where the subscript test picks the case whose parameter is text, its raw value can close the quotes.
  tool: conditional_selector_subscript_text.xml
  code: shell-injection
  review:
    serious_rules: [shell-injection]
    findings:
      - {rule: shell-injection, severity: high, accessor: raw, param: c.word, checkable: true}
  red:
    - inputs: {c: {sel: free, word: "a';touch harm-marker;'"}}
      harm: true
      expect:
        rejected: true
        message_contains: ["the value of input 'c.word' contains the characters [' ;]"]
  green:
    - inputs: {c: {sel: free, word: "a;b|c && d"}}
      harm: true
      expect: {rejected: false}
    - inputs: {c: {sel: fixed, word: a}}
      expect: {rejected: false}

path_traversal:
  doc: >-
    A file name the user gives is written as a path `cp` writes to. With `enforce_data`, a slash in it is refused,
    since it can name a file outside the job's directory.
  tool: copy_to_named_file.xml
  code: path-traversal
  review:
    findings:
      - {rule: path-traversal, severity: medium, accessor: text, param: name, checkable: true}
  red:
    - config: {mode: enforce_data}
      datasets: {input: {name: reads.txt}}
      inputs: {name: "../harm-marker"}
      harm: true
      expect:
        rejected: true
        message_contains: ["the value of input 'name' contains the characters [/]"]
  green:
    - config: {mode: enforce_data}
      datasets: {input: {name: reads.txt}}
      inputs: {name: reads.txt}
      harm: true
      expect: {rejected: false}
    - doc: With `enforce_code`, the default, a path is not refused.
      datasets: {input: {name: reads.txt}}
      inputs: {name: "../reads.txt"}
      expect: {rejected: false}

option_injection:
  doc: >-
    A quoted value that starts an argument can begin with a dash, and `sort` reads it as an option. With
    `enforce_data`, a leading dash is refused.
  tool: sort_quoted_operand.xml
  code: option-injection
  review:
    findings:
      - {rule: option-injection, severity: low, accessor: text, param: file, checkable: true}
  red:
    - config: {mode: enforce_data}
      datasets: {input: {name: reads.txt}}
      inputs: {file: "-oharm-marker"}
      harm: true
      expect:
        rejected: true
        message_contains: ["the value of input 'file' contains the characters [a leading -]"]
  green:
    - doc: A dash inside the value is not an option.
      config: {mode: enforce_data}
      datasets: {input: {name: reads.txt}}
      inputs: {file: "reads-1.txt"}
      expect: {rejected: false}
    - doc: With `enforce_code`, the default, a leading dash is not refused.
      datasets: {input: {name: reads.txt}}
      inputs: {file: "-r"}
      expect: {rejected: false}

argument_injection:
  doc: >-
    An unquoted value splits into words. With `enforce_data`, a job is refused when a word can be an option, a home
    directory, a path or a glob; with `enforce_all`, also when the words are plain.
  tool: sort_unquoted_operands.xml
  code: argument-injection
  review:
    findings:
      - {rule: argument-injection, severity: medium, accessor: text, param: files, checkable: true}
  red:
    - config: {mode: enforce_data}
      datasets: {input: {name: reads.txt}}
      inputs: {files: "reads.txt -o harm-marker"}
      harm: true
      expect:
        rejected: true
        message_contains: ["the value of input 'files' contains the characters [space a word starting with -]"]
    - doc: Plain words are refused only with `enforce_all`.
      config: {mode: enforce_all}
      datasets: {input: {name: reads.txt}}
      inputs: {files: "reads.txt reads.txt"}
      expect: {rejected: true}
  green:
    - config: {mode: enforce_data}
      datasets: {input: {name: reads.txt}}
      inputs: {files: "reads.txt reads.txt"}
      harm: true
      expect: {rejected: false}
    - config: {mode: enforce_all}
      datasets: {input: {name: reads.txt}}
      inputs: {files: "reads.txt"}
      harm: true
      expect: {rejected: false}

unquoted_quotes_only_regroup_words:
  doc: >-
    An unquoted value of letters, spaces and double quotes only adds or regroups plain words: a quote changes which
    words are joined, not what they are. A quote that opens a string for the next value is a stray quote.
  tool: unquoted_letters_spaces_quotes.xml
  review:
    findings:
      - {rule: argument-injection, severity: low, accessor: text, param: files, checkable: true}
    absent:
      - {rule: argument-injection, severity: medium, param: files}
  green:
    - config: {mode: enforce_data}
      datasets: {input: {}}
      inputs: {files: 'reads.txt "reads.txt"'}
      harm: true
      expect: {rejected: false}
    - doc: A lone quote leaves the line unbalanced, which the shell refuses to run.
      config: {mode: enforce_data}
      datasets: {input: {}}
      inputs: {files: 'reads.txt"'}
      expect: {rejected: false}

unquoted_quotes_and_dash_split_into_options:
  doc: With a dash allowed too, a word of the value can be an option, also between quotes.
  tool: unquoted_letters_spaces_quotes_dash.xml
  code: argument-injection
  review:
    findings:
      - {rule: argument-injection, severity: medium, accessor: text, param: files, checkable: true}
  red:
    - config: {mode: enforce_data}
      datasets: {input: {}}
      inputs: {files: 'reads.txt "-o" harm-marker'}
      harm: true
      expect: {rejected: true}
  green:
    - config: {mode: enforce_data}
      datasets: {input: {}}
      inputs: {files: '"reads.txt" reads.txt'}
      harm: true
      expect: {rejected: false}

unquoted_quotes_before_quoted_operators:
  doc: >-
    A quote of the value flips the quoting of the template text after it, and that text holds a command character
    inside quotes: the value can do more than regroup plain words.
  tool: unquoted_quotes_before_quoted_operators.xml
  review:
    findings:
      - {rule: argument-injection, severity: medium, accessor: text, param: files, checkable: true}
  green:
    - config: {mode: enforce_data}
      datasets: {input: {}}
      inputs: {files: "reads.txt reads.txt"}
      harm: true
      expect: {rejected: false}

unquoted_quotes_rewritten:
  doc: >-
    Where a rewrite of the template can add a quote the check does not see, a value of plain words and quotes
    stays medium, so that the strict check refuses its jobs with `enforce_data`.
  tool: unquoted_quotes_rewritten.xml
  code: uncheckable-rewrites
  review:
    rewrites: true
    findings:
      - {rule: argument-injection, severity: medium, accessor: text, param: files}
  red:
    - config: {mode: enforce_data}
      datasets: {input: {}}
      inputs: {files: "reads.txt"}
      expect: {rejected: true}
  green:
    - datasets: {input: {}}
      inputs: {files: "reads.txt"}
      harm: true
      expect: {rejected: false}

backslash_mapping_escapes_redirect:
  doc: >-
    A sanitizer that maps `>` to `\>`, and keeps no backslash of the user's, writes a literal `>` even unquoted:
    the value only splits into words.
  tool: mapping_escape_gt_unquoted.xml
  review:
    serious_rules: []
    findings:
      - {rule: argument-injection, accessor: text, param: p}
  green:
    - inputs: {p: "a > harm-marker"}
      harm: true
      expect: {rejected: false}

backslash_mapping_with_raw_backslash:
  doc: >-
    Where the sanitizer keeps the user's own backslash, that backslash escapes the one the mapping writes, and the
    `>` after it redirects.
  tool: mapping_escape_gt_raw_backslash.xml
  code: shell-injection
  review:
    serious_rules: [shell-injection]
    findings:
      - {rule: shell-injection, severity: high, accessor: text, param: p, checkable: true}
  red:
    - inputs: {p: 'a\>harm-marker'}
      harm: true
      expect: {rejected: true}
  green:
    - inputs: {p: "a b-c"}
      harm: true
      expect: {rejected: false}

dq_escape_mapping_still_allows_substitution:
  doc: >-
    Mapping `"` to `\"` and `\` to `\\` keeps a value inside its double quotes, but `$(` and backticks still run
    there.
  tool: mapping_escape_dq.xml
  code: shell-injection
  review:
    serious_rules: [shell-injection]
    findings:
      - {rule: shell-injection, severity: high, accessor: text, param: p, checkable: true}
  red:
    - inputs: {p: "$(touch harm-marker)"}
      harm: true
      expect: {rejected: true}
  green:
    - inputs: {p: 'a "b"; c\'}
      harm: true
      expect: {rejected: false}

dq_escape_mapping_without_substitution:
  doc: >-
    With `$` and the backtick refused by a validator, a value whose sanitizer maps `"` to `\"` and `\` to `\\` stays
    inside its double quotes.
  tool: mapping_escape_dq_validated.xml
  review:
    serious_rules: []
  green:
    - inputs: {p: 'a";touch harm-marker;"'}
      harm: true
      expect: {rejected: false}
    - inputs: {p: 'a\'}
      harm: true
      expect: {rejected: false}

dq_escape_mapping_with_raw_backslash:
  doc: >-
    Where the sanitizer keeps the user's own backslash, it escapes the backslash of a `\"` the mapping writes, and the
    quote then closes the string.
  tool: mapping_escape_dq_raw_backslash.xml
  code: shell-injection
  review:
    serious_rules: [shell-injection]
    findings:
      - {rule: shell-injection, severity: high, accessor: text, param: p, checkable: true}
  red:
    - inputs: {p: 'x\";touch harm-marker #'}
      harm: true
      expect: {rejected: true}
  green:
    - inputs: {p: "a;b|c && d"}
      harm: true
      expect: {rejected: false}

backslash_mapping_after_template_backslash:
  doc: >-
    A backslash the template writes just before the value escapes the backslash of the value's first escape, and
    the `$` after it is bare.
  tool: mapping_escape_after_template_backslash.xml
  code: shell-injection
  review:
    serious_rules: [shell-injection]
    findings:
      - {rule: shell-injection, severity: high, accessor: text, param: p, checkable: true}
  red:
    - inputs: {p: "$(touch harm-marker)"}
      harm: true
      expect: {rejected: true}
  green:
    - inputs: {p: "a b"}
      harm: true
      expect: {rejected: false}

backslash_mapping_after_computed_backslash:
  doc: >-
    A value the template computes, whose text the analysis does not know (`"\\".strip()`), can end in a backslash
    too: written just before the value, it escapes the backslash of the value's first escape.
  tool: mapping_escape_after_computed_backslash.xml
  code: shell-injection
  review:
    serious_rules: [shell-injection]
    findings:
      - {rule: shell-injection, severity: high, accessor: text, param: p, checkable: true}
  red:
    - inputs: {p: "$(touch harm-marker)"}
      harm: true
      expect: {rejected: true}
  green:
    - inputs: {p: "a b"}
      harm: true
      expect: {rejected: false}

backslash_mapping_in_backticks:
  doc: >-
    Inside backticks the shell takes away a backslash before `$`, then reads the text again: an escape the sanitizer
    writes for `$` does not hold there.
  tool: mapping_escape_in_backticks.xml
  code: shell-injection
  review:
    serious_rules: [shell-injection]
    findings:
      - {rule: shell-injection, severity: high, accessor: text, param: p, checkable: true}
  red:
    - inputs: {p: "$(touch harm-marker)"}
      harm: true
      expect: {rejected: true}
  green:
    - inputs: {p: "a b"}
      harm: true
      expect: {rejected: false}

backslash_mapping_keeps_path:
  doc: >-
    `\/` is still a slash once the shell takes the backslash away: with `enforce_data`, a value with one is refused
    as a redirection target.
  tool: mapping_escape_slash_redirect.xml
  code: path-traversal
  review:
    findings:
      - {rule: path-traversal, severity: medium, accessor: text, param: p, checkable: true}
  red:
    - config: {mode: enforce_data}
      inputs: {p: "/tmp/elsewhere"}
      expect: {rejected: true}
  green:
    - config: {mode: enforce_data}
      inputs: {p: "result"}
      harm: true
      expect: {rejected: false}

sq_escape_mapping_does_not_escape:
  doc: >-
    Inside single quotes a backslash is a literal character: a sanitizer that maps `'` to `\'` leaves the quote to
    close the string.
  tool: mapping_escape_sq.xml
  code: shell-injection
  review:
    serious_rules: [shell-injection]
    findings:
      - {rule: shell-injection, severity: high, accessor: text, param: p, checkable: true}
  red:
    - inputs: {p: "a';touch harm-marker #"}
      harm: true
      expect: {rejected: true}
  green:
    - inputs: {p: "a;b|c && d"}
      harm: true
      expect: {rejected: false}

dataset_content_command_substitution:
  doc: >-
    A command substitution that reads a dataset writes its content where the job runs. Unquoted, the shell
    splits it into words and globs them, so it can add options. The check reads the file Galaxy keeps; with
    `enforce_data`, content with a word that starts with a dash is refused.
  tool: dataset_content_substitution.xml
  code: argument-injection
  review:
    findings:
      - {rule: argument-injection, severity: medium, accessor: dataset_content, param: fields, checkable: true}
  red:
    - config: {mode: enforce_data}
      datasets:
        fields: {content: "1 -o harm-marker\n"}
      harm: true
      expect:
        rejected: true
        message_contains:
          - "the content of a dataset of input 'fields' contains the characters [newline space a word starting with -]"
  green:
    - config: {mode: enforce_data}
      datasets:
        fields: {content: "1\n"}
      harm: true
      expect: {rejected: false}
    - doc: With `enforce_code`, the default, words the shell splits are not refused.
      datasets:
        fields: {content: "1 -r\n"}
      expect: {rejected: false}

dataset_content_substitution_quoted:
  doc: >-
    Inside double quotes the output of a command substitution stays one word: the shell neither splits nor
    globs it, nor reads quotes or operators in it.
  tool: dataset_content_substitution_quoted.xml
  review:
    absent:
      - {rule: argument-injection, param: fields}
  green:
    - config: {mode: enforce_data}
      datasets:
        fields: {content: "1\n"}
      harm: true
      expect: {rejected: false}
    - doc: The content is one argument of `sort`, a key it refuses; nothing else runs.
      config: {mode: enforce_data}
      datasets:
        fields: {content: "1 -o harm-marker\n"}
      expect: {rejected: false}

check_values_false_ignores_param_sanitizer:
  doc: >-
    A tool that does not check its values gets its inputs without parameter wrappers: Galaxy writes a text value
    through the default sanitizer, not the param's own. A letters-only sanitizer does not apply, and the
    unquoted value splits into words. With `enforce_data`, a word that can be an option is refused.
  tool: check_values_false_custom_sanitizer.xml
  code: argument-injection
  review:
    findings:
      - {rule: argument-injection, severity: medium, accessor: text, param: files, checkable: true}
  red:
    - config: {mode: enforce_data}
      datasets: {input: {}}
      inputs: {files: "reads -o harm-marker"}
      harm: true
      expect:
        rejected: true
        message_contains: ["the value of input 'files' contains the characters [space a word starting with -]"]
  green:
    - config: {mode: enforce_data}
      datasets: {input: {}}
      inputs: {files: "reads reads"}
      harm: true
      expect: {rejected: false}
    - doc: With `enforce_code`, the default, words the shell splits are not refused.
      datasets: {input: {}}
      inputs: {files: "reads -r"}
      expect: {rejected: false}

param_sanitizer_applies_with_check_values:
  doc: With parameter wrappers, the letters-only sanitizer applies, and the unquoted value is one plain word.
  tool: custom_sanitizer_letters_unquoted.xml
  review:
    absent:
      - {rule: argument-injection, param: files}
  green:
    - config: {mode: enforce_data}
      datasets: {input: {}}
      inputs: {files: reads}
      harm: true
      expect: {rejected: false}
    - doc: The sanitizer writes the space and the dashes as `X`; `sort` finds no such file, and nothing else runs.
      config: {mode: enforce_data}
      datasets: {input: {}}
      inputs: {files: "reads -o harm-marker"}
      expect: {rejected: false}

path_like_name:
  doc: >-
    `sort -o` writes to a file named after the element identifier, which the review does not take for a path
    of its own. With `enforce_data`, an identifier or dataset name that a template writes may not contain a
    slash or start with a dash or a tilde.
  tool: sort_to_named_file.xml
  code: path-like-name
  red:
    - config: {mode: enforce_data}
      datasets:
        input: {name: "../harm-marker"}
      harm: true
      expect:
        rejected: true
        message_contains: ["an element identifier or the name of input 'input' contains the characters [/]"]
    - config: {mode: enforce_data}
      datasets:
        input: {name: "-reads.txt"}
      expect:
        rejected: true
        message_contains: ["an element identifier or the name of input 'input' contains the characters [a leading -]"]
  green:
    - config: {mode: enforce_data}
      datasets:
        input: {name: "reads 1.txt"}
      harm: true
      expect: {rejected: false}
    - doc: With `enforce_code`, the default, a path is not refused.
      datasets:
        input: {name: "../reads.txt"}
      expect: {rejected: false}

env_assignment:
  doc: >-
    `env` takes every word before the command as an assignment or the command: an unquoted value that splits
    runs a command of its own.
  tool: env_assignment.xml
  code: argument-injection
  review:
    findings:
      - {rule: argument-injection, severity: high, accessor: text, param: label, checkable: true}
  red:
    - datasets: {input: {name: reads.txt}}
      inputs: {label: "x touch harm-marker"}
      harm: true
      expect:
        rejected: true
        message_contains: ["the value of input 'label' contains the characters [space]"]
  green:
    - datasets: {input: {name: reads.txt}}
      inputs: {label: x}
      harm: true
      expect: {rejected: false}

export_name:
  doc: >-
    A value that names the variable `export` sets can set BASH_ENV, PATH or LD_PRELOAD with letters alone.
  tool: export_name.xml
  code: uncheckable-letters-are-code
  review:
    serious_rules: [variable-name]
  red:
    - datasets: {input: {name: reads.txt}}
      inputs: {name: LABEL}
      expect: {rejected: true, message_contains: ["letters alone can be code"]}
  green:
    - config: {when_unsure: log}
      datasets: {input: {name: reads.txt}}
      inputs: {name: LABEL}
      harm: true
      expect: {rejected: false, warns: [uncheckable-letters-are-code]}

export_value:
  doc: >-
    bash and dash from 0.5.11 take an operand of `export` whole, older dash splits it into more assignments.
    With `enforce_data`, an unquoted value of one that holds a space and a `=` is refused.
  tool: export_value.xml
  code: argument-injection
  review:
    findings:
      - {rule: argument-injection, severity: medium, accessor: text, param: label, checkable: true}
  red:
    - config: {mode: enforce_data}
      datasets: {input: {name: reads.txt}}
      inputs: {label: "x OTHER=1"}
      expect:
        rejected: true
        message_contains: ["the value of input 'label' contains the characters [space =]"]
  green:
    - config: {mode: enforce_data}
      datasets: {input: {name: reads.txt}}
      inputs: {label: "x y"}
      harm: true
      expect: {rejected: false}

not_analysed_strict:
  doc: >-
    Where the review does not follow parts of a template, it cannot tell which characters do harm,
    so every value the template reads must be plain.
  tool: search_list.xml
  code: not-plain-unchecked-place
  review:
    unchecked_locations: {command: parts of it were not analysed}
  red:
    - collections:
        input:
          elements: [{identifier: "a';touch harm-marker;'"}]
      harm: true
      expect:
        rejected: true
        message_contains:
          - "an element identifier or the name of input 'input' contains [' ;]"
          - "allows only plain names and values for tool"
          - "because this tool writes values in places that no check of their characters can judge (command)"
    - doc: Even a character that is harmless where the value is written.
      collections:
        input:
          elements: [{identifier: "a;b"}]
      expect: {rejected: true}
  green:
    - collections:
        input:
          elements: [{identifier: "sample 1/reads.fq"}]
      harm: true
      expect: {rejected: false}
    - doc: An administrator can run such jobs and only log what the strict check refuses.
      config: {when_unsure: log}
      collections:
        input:
          elements: [{identifier: "a;b"}]
      harm: true
      expect: {rejected: false, warns: [not-plain-unchecked-place]}

mutator_passed_on:
  doc: >-
    The review follows a method that changes a list where the template calls it on the list, or maps it over
    values. Passed on to anything else, here `filter`, what it adds is not followed: every value the template
    reads must be plain.
  tool: mutator_passed_on.xml
  code: not-plain-unchecked-place
  review:
    unchecked_locations: {command: parts of it were not analysed}
  red:
    - inputs: {word: "a';touch harm-marker;'"}
      harm: true
      expect:
        rejected: true
        message_contains: ["because this tool writes values in places that no check of their characters can judge (command)"]
  green:
    - inputs: {word: "sample_1"}
      harm: true
      expect: {rejected: false}

raw_dataset_model:
  doc: >-
    `$input.unsanitized.name` is the dataset's name as the user set it, without the sanitizer: the check reads
    it from the model too.
  tool: raw_dataset_model.xml
  code: shell-injection
  review:
    patterns: [model-access]
    serious_rules: [shell-injection]
    findings:
      - {rule: shell-injection, accessor: raw_dataset_attribute, param: input, key: name, checkable: true}
      - {rule: template-model-access}
  red:
    - datasets:
        input: {name: "a';touch harm-marker;'"}
      harm: true
      expect:
        rejected: true
        message_contains: ["the name of a dataset of input 'input' contains the characters [' ;]"]
  green:
    - doc: Command characters stay inside the quotes when no quote closes them.
      datasets:
        input: {name: "a;b|c"}
      harm: true
      expect: {rejected: false}

raw_dataset_history:
  doc: >-
    Beyond the dataset's own strings and metadata, the model reaches its history, its tags and the job that
    made it, which no check of the job's values sees: every job is refused.
  tool: raw_dataset_history.xml
  code: uncheckable-template-code
  review:
    patterns: [model-access]
    findings:
      - {rule: shell-injection, accessor: opaque, param: input, checkable: false}
  red:
    - datasets:
        input: {name: reads}
      expect: {rejected: true, message_contains: ["$unsanitized.history"]}
  green:
    - config: {when_unsure: log}
      datasets:
        input: {name: reads}
      harm: true
      expect: {rejected: false, warns: [uncheckable-template-code]}

include_dataset:
  doc: >-
    `#include` of a value reads template code the job sends: here the dataset, which no sanitizer touches.
    Its `#` directives would run in the server; every job is refused.
  tool: include_dataset.xml
  code: uncheckable-template-code
  review:
    patterns: [template-code]
    findings:
      - {rule: template-include, severity: critical}
  red:
    - datasets:
        input: {content: "touch harm-marker\n"}
      harm: true
      expect: {rejected: true, message_contains: ["(#include)"]}
  green:
    - config: {when_unsure: log}
      datasets:
        input: {content: "echo hi\n"}
      harm: true
      expect: {rejected: false, warns: [uncheckable-template-code]}

template_macro_rebound:
  doc: >-
    `#include source=$pre#` reads the template macro `pre` only while nothing else answers to `$pre`. Here a
    `#set` does, so the value is included: every job is refused.
  tool: template_macro_rebound.xml
  code: uncheckable-template-code
  review:
    patterns: [template-code]
    findings:
      - {rule: template-include, severity: critical}
  red:
    - inputs: {word: "touch harm-marker &&"}
      harm: true
      expect: {rejected: true, message_contains: ["(#include)"]}
  green:
    - config: {when_unsure: log}
      inputs: {word: "echo hi &&"}
      harm: true
      expect: {rejected: false, warns: [uncheckable-template-code]}

pipe_to_shell:
  doc: A value in text piped to a shell is code whatever its characters, so every job is refused.
  tool: pipe_to_shell.xml
  code: uncheckable-letters-are-code
  review:
    unchecked_locations: {command: it sends text to a shell to run}
  red:
    - inputs: {word: "a;touch harm-marker"}
      harm: true
      expect: {rejected: true, message_contains: ["cannot check any value"]}
    - doc: Even a plain value.
      inputs: {word: hello}
      expect: {rejected: true}
  green:
    - config: {when_unsure: log}
      inputs: {word: hello}
      harm: true
      expect: {rejected: false, warns: [uncheckable-letters-are-code]}

shell_runs_script_file:
  doc: >-
    A shell given a script file reads the data piped into it as input, not as code, so the value is checked where
    it is written.
  tool: pipe_to_shell_script.xml
  code: shell-injection
  review:
    serious_rules: [shell-injection]
    unchecked_locations: {}
    findings:
      - {rule: shell-injection, severity: high, accessor: raw, param: word, checkable: true}
  red:
    - inputs: {word: "a';touch harm-marker;'"}
      harm: true
      expect: {rejected: true, codes: [shell-injection]}
  green:
    - doc: Command characters stay inside the quotes, and the script reads them as data.
      inputs: {word: "a;b|c $(touch harm-marker)"}
      harm: true
      expect: {rejected: false}

command_position:
  doc: A value that names the program to run is code with letters alone.
  tool: command_position.xml
  code: uncheckable-letters-are-code
  review:
    serious_rules: [command-position]
    findings:
      - {rule: command-position, accessor: text, param: program, checkable: false}
  red:
    - inputs: {program: "touch harm-marker"}
      harm: true
      expect: {rejected: true, message_contains: ["letters alone can be code"]}
  green:
    - config: {when_unsure: log}
      inputs: {program: echo}
      harm: true
      expect: {rejected: false, warns: [uncheckable-letters-are-code]}

rewrites_restore_tokens:
  doc: A template that turns the sanitizer's tokens back into quotes and redirects undoes the sanitizer.
  tool: rewrites_restore_tokens.xml
  code: uncheckable-rewrites
  review:
    rewrites: true
    serious_rules: [shell-injection]
  red:
    - inputs: {word: "x' >harm-marker '"}
      harm: true
      expect: {rejected: true, message_contains: ["its templates change values with .replace"]}
    - doc: Even a plain value.
      inputs: {word: hello}
      expect: {rejected: true}
  green:
    - config: {when_unsure: log}
      inputs: {word: hello}
      harm: true
      expect: {rejected: false, warns: [uncheckable-rewrites]}

literal_rewrite:
  doc: >-
    A rewrite with literal text of a value as the job carries it adds what it writes only to a value that holds
    what it replaces, so the job check judges each job with it. Escaping the double quote of a value that a string
    method reads past its sanitizer leaves `$` and backticks live.
  tool: raw_text_escaped_double_quoted.xml
  code: shell-injection
  review:
    rewrites: false
    serious_rules: [shell-injection]
    findings:
      - {rule: shell-injection, severity: high, accessor: raw, param: word, checkable: true}
  red:
    - inputs: {word: "$(touch harm-marker)"}
      harm: true
      expect: {rejected: true, codes: [shell-injection]}
    - doc: The job check does not follow the escaping, so a double quote with a command character is refused too.
      inputs: {word: 'x" ; touch harm-marker ; "'}
      expect: {rejected: true, codes: [shell-injection]}
  green:
    - inputs: {word: "a;b|c && d's"}
      harm: true
      expect: {rejected: false}
    - doc: A double quote alone cannot start a command.
      inputs: {word: 'say "hi"'}
      harm: true
      expect: {rejected: false}

rewrites_and_template_code:
  doc: A refusal names every reason no value of the tool can be checked.
  tool: rewrites_and_template_code.xml
  code: uncheckable-rewrites
  review:
    patterns: [template-code]
    rewrites: true
    serious_rules: [shell-injection]
    findings:
      - {rule: template-exec, severity: critical}
  red:
    - inputs: {word: "x' >harm-marker '"}
      harm: true
      expect: {rejected: true, codes: [uncheckable-rewrites, uncheckable-template-code]}
  green:
    - config: {when_unsure: log}
      inputs: {word: hello}
      harm: true
      expect: {rejected: false, warns: [uncheckable-rewrites, uncheckable-template-code]}

lambda_late_binding:
  doc: >-
    A lambda reads a name of the template when it is called, not when it is made. Here the template sets the
    name again in between, to a value: the review does not follow such a lambda, and every job is refused.
  tool: lambda_late_binding.xml
  code: uncheckable-template-code
  review:
    patterns: [template-code]
    findings:
      - {rule: template-lambda, severity: high}
  red:
    - inputs: {word: "a';touch harm-marker;'"}
      harm: true
      expect: {rejected: true, message_contains: ["(lambda)"]}
  green:
    - config: {when_unsure: log}
      inputs: {word: "a;b"}
      harm: true
      expect: {rejected: false, warns: [uncheckable-template-code]}

lambda_changes_a_list:
  doc: >-
    A lambda that changes a list of the template with what its call passes in is not followed either: every
    job is refused.
  tool: lambda_changes_a_list.xml
  code: uncheckable-template-code
  review:
    patterns: [template-code]
    findings:
      - {rule: template-lambda, severity: high}
  red:
    - inputs: {word: "a';touch harm-marker;'"}
      harm: true
      expect: {rejected: true, message_contains: ["(lambda)"]}
  green:
    - config: {when_unsure: log}
      inputs: {word: "a;b"}
      harm: true
      expect: {rejected: false, warns: [uncheckable-template-code]}

template_code:
  doc: A template that imports code can read text the job does not carry, so no value counts as plain.
  tool: template_code.xml
  code: uncheckable-template-code
  review:
    patterns: [template-code]
    unchecked_locations: {command: parts of it were not analysed}
    findings:
      - {rule: template-exec, severity: critical}
  red:
    - inputs: {word: hello}
      expect: {rejected: true, message_contains: ["run code or read data the job does not carry"]}
  green:
    - config: {when_unsure: log}
      inputs: {word: hello}
      harm: true
      expect: {rejected: false, warns: [uncheckable-template-code]}

user_object_unsanitized:
  doc: >-
    With the sanitizer off, the user object is read as it is stored. A template that reads it other than by
    the name of one preference, here every preference in a loop, writes values the job check cannot trace.
  tool: user_preferences_unsanitized_loop.xml
  code: uncheckable-template-code
  review:
    patterns: [user-object]
    findings:
      - {rule: template-app-access, severity: medium}
      - {rule: shell-injection, accessor: opaque, checkable: false}
  red:
    - user: {preferences: {"spec|label": "a';touch harm-marker;'"}}
      harm: true
      expect:
        rejected: true
        codes: [uncheckable-template-code, uncheckable-untraced-value]
        message_contains:
          - "run code or read data the job does not carry"
          - "it writes values it cannot trace to an input (command)"
  green:
    - config: {when_unsure: log}
      user: {preferences: {"spec|label": "Bob"}}
      harm: true
      expect: {rejected: false, warns: [uncheckable-template-code, uncheckable-untraced-value]}

untraced_value:
  doc: >-
    A preference read in a loop, by a name the template computes, cannot be traced to one preference, so no
    check sees its value. Galaxy sanitizes it here, but the job is refused whatever its values.
  tool: user_preferences_loop.xml
  code: uncheckable-untraced-value
  review:
    findings:
      - {rule: shell-injection, accessor: opaque, checkable: false}
  red:
    - user: {preferences: {"spec|label": "hello"}}
      expect: {rejected: true, message_contains: ["it writes values it cannot trace to an input (command)"]}
  green:
    - config: {when_unsure: log}
      user: {preferences: {"spec|label": "a';touch harm-marker;'"}}
      harm: true
      expect: {rejected: false, warns: [uncheckable-untraced-value]}

review_failed:
  doc: A tool whose review fails cannot have any job checked.
  tool: raw_text_single_quoted.xml
  code: uncheckable-review-failed
  red:
    - fault: review
      inputs: {word: hello}
      expect: {rejected: true, message_contains: ["the security review of this tool failed"]}
  green:
    - fault: review
      config: {when_unsure: log}
      inputs: {word: hello}
      expect: {rejected: false, warns: [uncheckable-review-failed]}

check_failed:
  doc: When comparing a job's values with the review fails, every value must be plain.
  tool: raw_text_single_quoted.xml
  code: not-plain-check-error
  red:
    - fault: check
      inputs: {word: "a;b"}
      expect: {rejected: true, message_contains: ["checking the job's values against the security review failed"]}
  green:
    - fault: check
      inputs: {word: hello}
      expect: {rejected: false}

strict_check_failed:
  doc: When the strict check itself fails, the job is refused.
  tool: search_list.xml
  code: uncheckable-strict-check-error
  red:
    - fault: strict_check
      collections:
        input:
          elements: [{identifier: sample1}]
      expect: {rejected: true, message_contains: ["checking its values strictly failed"]}
  green:
    - fault: strict_check
      config: {when_unsure: log}
      collections:
        input:
          elements: [{identifier: sample1}]
      expect: {rejected: false, warns: [uncheckable-strict-check-error]}

reflection_bypass:
  doc: >-
    Read by name through `getattr`, the dataset model is out of the review's sight: it can write any value
    without a finding about it, its history's name as well as its own, so every job is refused.
  tool: reflection_getattr.xml
  code: uncheckable-template-code
  review:
    patterns: [reflection]
    serious_rules: []
  red:
    - datasets:
        input: {name: "x'; touch harm-marker; echo '"}
      harm: true
      expect: {rejected: true, message_contains: ["run code or read data the job does not carry (getattr)"]}
    - doc: Even a plain name.
      datasets:
        input: {name: reads.fq}
      expect: {rejected: true}
  green:
    - config: {when_unsure: log}
      datasets:
        input: {name: reads.fq}
      harm: true
      expect: {rejected: false, warns: [uncheckable-template-code]}

output_filter_vars:
  doc: >-
    `vars()` in an output filter reaches Python objects, but Galaxy evaluates filters when it creates the outputs:
    nothing it reads is written into the command, which is checked as usual.
  tool: output_filter_vars.xml
  review:
    patterns: [reflection]
  green:
    - inputs: {label: "a;b|c"}
      harm: true
      expect: {rejected: false}

getvar_user_name:
  doc: >-
    A name the user gives (`$getVar(str($which))`) can be any variable, which no check of the job's values sees:
    every job is refused.
  tool: getvar_user_name.xml
  code: uncheckable-template-code
  review:
    patterns: [reflection]
  red:
    - inputs: {which: label, label: hello}
      expect: {rejected: true, message_contains: ["run code or read data the job does not carry (getVar)"]}
  green:
    - config: {when_unsure: log}
      inputs: {which: label, label: hello}
      expect: {rejected: false, warns: [uncheckable-template-code]}

known_helper:
  doc: >-
    The read group helper of bwa and bowtie2 looks a parameter up with `getVar` by the name it is called with. Called
    with literal names only, it reads the parameters it names, whose values are checked as usual.
  tool: known_helper.xml
  code: shell-injection
  review:
    serious_rules: [shell-injection]
    findings:
      - {rule: shell-injection, severity: high, accessor: raw, param: word, checkable: true}
  red:
    - inputs: {word: "a';touch harm-marker;'"}
      harm: true
      expect:
        rejected: true
        message_contains: ["the value of input 'word' contains the characters [' ;]"]
  green:
    - inputs: {word: "a;b|c && d"}
      harm: true
      expect: {rejected: false}

known_loop:
  doc: >-
    The hmmer3 tools write each output a select names with `getVar` of the selected value. Galaxy accepts only the
    select's options, so the loop reads the parameters they name, whose values are checked as usual.
  tool: known_loop.xml
  code: shell-injection
  review:
    serious_rules: [shell-injection]
    findings:
      - {rule: shell-injection, severity: high, accessor: raw, param: word, checkable: true}
      - {rule: shell-injection, severity: high, accessor: raw, param: other, checkable: true}
  red:
    - inputs: {fields: [other, word], word: "a';touch harm-marker;'", other: b}
      harm: true
      expect:
        rejected: true
        message_contains: ["the value of input 'word' contains the characters [' ;]"]
  green:
    - inputs: {fields: [word, other], word: "a;b|c && d", other: b}
      harm: true
      expect: {rejected: false}

known_global_list:
  doc: >-
    The gatk4 tools look a parameter up in each section of a list they set once, with `getVar` of the section and
    the name. The list is fixed, so the loop reads the parameters it names, whose values are checked as usual.
  tool: known_global_list.xml
  code: shell-injection
  review:
    serious_rules: [shell-injection]
    findings:
      - {rule: shell-injection, severity: high, accessor: raw, param: optional.other, checkable: true}
  red:
    - inputs: {optional: {other: "a';touch harm-marker;'"}}
      harm: true
      expect:
        rejected: true
        message_contains: ["the value of input 'optional.other' contains the characters [' ;]"]
  green:
    - inputs: {optional: {other: "a;b|c && d"}}
      harm: true
      expect: {rejected: false}

known_literal_list:
  doc: >-
    idpqonvert and llm_hub look a parameter up with `getVar` of each name in a list written in the template,
    changed by `replace` with fixed text. The names are fixed, so the loop reads the parameters they name, whose
    values are checked as usual.
  tool: known_literal_list.xml
  code: shell-injection
  review:
    serious_rules: [shell-injection]
    findings:
      - {rule: shell-injection, severity: high, accessor: raw, param: scoring.comet_xcorr_weight, checkable: true}
      - {rule: shell-injection, severity: high, accessor: raw, param: scoring.ms-gf_specevalue_weight, checkable: true}
  red:
    - inputs: {scoring: {comet_xcorr_weight: "1", ms-gf_specevalue_weight: "a';touch harm-marker;'"}}
      harm: true
      expect:
        rejected: true
        message_contains: ["the value of input 'scoring.ms-gf_specevalue_weight' contains the characters [' ;]"]
  green:
    - inputs: {scoring: {comet_xcorr_weight: "1", ms-gf_specevalue_weight: "a;b|c && d"}}
      harm: true
      expect: {rejected: false}

known_select_value:
  doc: >-
    infernal cmbuild writes each output a select names with `getVar` of each item of the select's value. Galaxy
    accepts only the select's options, as a list, or as one option, whose letters the loop then gives: the loop
    reads the parameters these name, whose values are checked as usual.
  tool: known_select_value.xml
  code: shell-injection
  review:
    serious_rules: [shell-injection]
    findings:
      - {rule: shell-injection, severity: high, accessor: raw, param: word, checkable: true}
      - {rule: shell-injection, severity: high, accessor: raw, param: other, checkable: true}
  red:
    - inputs: {fields: [other, word], word: "a';touch harm-marker;'", other: b}
      harm: true
      expect:
        rejected: true
        message_contains: ["the value of input 'word' contains the characters [' ;]"]
  green:
    - inputs: {fields: [word, other], word: "a;b|c && d", other: b}
      harm: true
      expect: {rejected: false}

nested_scope_lookup:
  doc: >-
    Cheetah looks `$name` up in the frame that runs it. A generator expression, a lambda or (before Python
    3.12) a comprehension runs in a frame of its own, which does not hold the template's `#set` locals: there
    `$label` is the parameter, whatever the template set `label` to. The review reads it as the parameter,
    whose value is checked as usual.
  tool: nested_scope_lookup.xml
  code: shell-injection
  review:
    serious_rules: [shell-injection]
    findings:
      - {rule: shell-injection, severity: high, accessor: raw, param: label, checkable: true}
  red:
    - inputs: {label: "a';touch harm-marker;'"}
      harm: true
      expect:
        rejected: true
        message_contains: ["the value of input 'label' contains the characters [' ;]"]
  green:
    - inputs: {label: "a;b|c && d"}
      harm: true
      expect: {rejected: false}

nested_scope_lambda:
  doc: >-
    A lambda's body runs in the lambda's own frame too: `$label` there is the parameter, not the `#set` local.
  tool: nested_scope_lambda.xml
  code: shell-injection
  review:
    serious_rules: [shell-injection]
    findings:
      - {rule: shell-injection, severity: high, accessor: raw, param: label, checkable: true}
  red:
    - inputs: {label: "a';touch harm-marker;'"}
      harm: true
      expect:
        rejected: true
        message_contains: ["the value of input 'label' contains the characters [' ;]"]
  green:
    - inputs: {label: "a;b|c && d"}
      harm: true
      expect: {rejected: false}

maybe_unset_local:
  doc: >-
    A `#set` that does not run leaves its local unbound, and `$label` after it is then the parameter of that
    name. The review reads the name as the local or the parameter, whose value is checked as usual. The job
    parameters that are not inputs do not reach the templates of a regular tool, so a local of any other name
    is the local alone.
  tool: maybe_unset_local.xml
  code: shell-injection
  review:
    serious_rules: [shell-injection]
    findings:
      - {rule: shell-injection, severity: high, accessor: text, param: label, checkable: true}
  red:
    - inputs: {mode: given, label: "a';touch harm-marker;'"}
      harm: true
      expect:
        rejected: true
        message_contains: ["the value of input 'label' contains the characters [' ;]"]
  green:
    - inputs: {mode: given, label: "a;b|c && d"}
      harm: true
      expect: {rejected: false}

galaxy_url_replaced:
  doc: >-
    A tool that keeps all its job parameters (`<inputs check_values="false">`, a data source tool, which
    seldom sanitizes) passes
    its templates the request parameters as they were sent. A parameter named like a value Galaxy sets
    before it adds the job's parameters (`__galaxy_url__`, `__history_id__`, `__datatypes_config__`) then
    replaces it, so the review reads such a name as a job parameter, whose value is checked as usual.
  tool: galaxy_url_data_source.xml
  code: shell-injection
  review:
    serious_rules: [shell-injection]
    findings:
      - {rule: shell-injection, severity: high, key: __galaxy_url__, checkable: true}
  red:
    - inputs: {word: a, __galaxy_url__: "a';touch harm-marker;'"}
      harm: true
      expect:
        rejected: true
        message_contains: ["the job parameter '__galaxy_url__' contains the characters [' ;]"]
  green:
    - inputs: {word: a, __galaxy_url__: "http://localhost:8080"}
      harm: true
      expect: {rejected: false}

getvar_request_parameter:
  doc: >-
    In a tool that keeps all its job parameters, `getVar` of a name no input has reads the request parameter
    of that name when there is one, whose value is checked as usual.
  tool: getvar_request_parameter.xml
  code: shell-injection
  review:
    serious_rules: [shell-injection]
    findings:
      - {rule: shell-injection, severity: high, key: organism, checkable: true}
  red:
    - inputs: {word: a, organism: "a';touch harm-marker;'"}
      harm: true
      expect:
        rejected: true
        message_contains: ["the job parameter 'organism' contains the characters [' ;]"]
  green:
    - inputs: {word: a, organism: "Homo sapiens"}
      harm: true
      expect: {rejected: false}

getvar_self:
  doc: >-
    `$self.getVar("name")` is the template object's getVar, as `$getVar("name")` is: it reads the input of that
    name, here written past its sanitizer.
  tool: getvar_self.xml
  code: shell-injection
  review:
    serious_rules: [shell-injection]
    findings:
      - {rule: shell-injection, severity: high, accessor: text, param: word, checkable: true}
  red:
    - inputs: {word: "a';touch harm-marker;'"}
      harm: true
      expect:
        rejected: true
        message_contains: ["the value of input 'word' contains the characters [' ;]"]
  green:
    - inputs: {word: "a;b|c"}
      harm: true
      expect: {rejected: false}

getvar_self_sanitized:
  doc: The same read of a text value Galaxy sanitizes cannot leave its quotes.
  tool: getvar_self_sanitized.xml
  review:
    serious_rules: []
    absent:
      - {rule: shell-injection, param: word}
  green:
    - inputs: {word: "a';touch harm-marker;'"}
      harm: true
      expect: {rejected: false}

galaxy_url_kept:
  doc: >-
    A regular tool's templates get only its inputs and the job parameters Galaxy passes them: a job
    parameter named `__galaxy_url__` does not replace Galaxy's value, which stays out of the review's sight.
  tool: galaxy_url_regular.xml
  review:
    serious_rules: []
  green:
    - inputs: {word: a, __galaxy_url__: "a';touch harm-marker;'"}
      harm: true
      expect: {rejected: false}

pure_lambda:
  doc: >-
    A lambda whose body reads only its arguments, literals and functions that compute a value from them is read
    as what it gives for the values the template passes: here a value quoted by `json.dumps`, whose own quote
    still closes the single quotes around it.
  tool: pure_lambda.xml
  code: shell-injection
  review:
    serious_rules: [shell-injection]
    findings:
      - {rule: shell-injection, severity: high, accessor: raw, param: word, checkable: true}
  red:
    - inputs: {word: "a';touch harm-marker;'"}
      harm: true
      expect:
        rejected: true
        message_contains: ["the value of input 'word' contains the characters [' ;]"]
  green:
    - inputs: {word: "a;b|c && d"}
      harm: true
      expect: {rejected: false}

app_model_read:
  doc: >-
    The application object reaches any data of the server. The review flags the read but follows no value
    of it; this job runs because it writes a count.
  tool: app_model.xml
  review:
    patterns: [app-access]
    serious_rules: []
  green:
    - harm: true
      expect: {rejected: false}

job_metadata_read:
  doc: The tool version of the job that made a dataset is set by the server, so the job runs.
  tool: job_metadata.xml
  review:
    patterns: [job-metadata]
    serious_rules: []
  green:
    - datasets:
        input: {name: reads.fq}
      harm: true
      expect: {rejected: false}

server_config_read:
  doc: An id the server encodes is the server's value, so the job runs.
  tool: server_config.xml
  review:
    patterns: [server-config]
    serious_rules: []
  green:
    - harm: true
      expect: {rejected: false}

output_size_limit_read:
  doc: >-
    The data source tools pass the server's output size limit, a number the admin sets, to their script. The
    review allows this one read of the configuration, so the job runs.
  tool: output_size_limit.xml
  review:
    patterns: []
    serious_rules: []
  green:
    - expect: {rejected: false}

output_size_limit_reach:
  doc: Reading past the output size limit, or keeping the configuration in a variable, is still flagged.
  tool: output_size_limit_reach.xml
  code: uncheckable-template-code
  review:
    findings:
      - {rule: template-app-access, severity: high}
      - {rule: template-reflection, severity: high}
    patterns: [server-config]
  red:
    - expect: {rejected: true}
  green:
    - config: {when_unsure: log}
      expect: {rejected: false, warns: [uncheckable-template-code]}

output_size_limit_getvar:
  doc: >-
    `getVar` of the same name reads the same number, and the review allows it as it allows the read by
    placeholder.
  tool: output_size_limit_getvar.xml
  review:
    patterns: []
    serious_rules: []
  green:
    - expect: {rejected: false}

output_size_limit_subscript:
  doc: >-
    The allowance is of the attribute read alone: a subscript of the application object, here on the way to
    the same number, is flagged as a read of the application object. Galaxy's wrapper of the application object
    takes no subscript, so the tool goes that way only for a negative limit.
  tool: output_size_limit_subscript.xml
  review:
    findings:
      - {rule: template-app-access, severity: high}
    patterns: [app-access]
  green:
    - expect: {rejected: false}

refused_when_unsure:
  doc: >-
    An administrator can refuse every job the review cannot check instead of checking its values strictly.
  tool: search_list.xml
  code: uncheckable-when-unsure
  review:
    unchecked_locations: {command: parts of it were not analysed}
  red:
    - config: {when_unsure: refuse}
      collections:
        input:
          elements: [{identifier: sample1}]
      expect: {rejected: true, message_contains: ["this server refuses every job it cannot check"]}
  green:
    - doc: With the default `strict`, the same job runs, since its values are plain.
      collections:
        input:
          elements: [{identifier: sample1}]
      harm: true
      expect: {rejected: false}
