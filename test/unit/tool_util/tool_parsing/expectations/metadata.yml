# Top-level tool metadata: id/version/profile, citations, xrefs.

parse_tool_identity:
  fixture: catDocker
  operation: parse
  assertions:
    - path: [id]
      value: catdc
    - path: [version]
      value: 1.0.0
    - path: [profile]
      value_matches: '^[0-9]+\.[0-9]+$'

parse_citations_and_xrefs:
  fixture: bibtex
  operation: parse
  assertions:
    - path: [id]
      value: bibtex
    - path: [citations, {type: doi}, content]
      value: 10.1101/gr.4086505
    - path: [xrefs, 0, type]
      value: bio.tools
    - path: [xrefs, 0, value]
      value: Citation.js

parse_yaml_tool_identity_and_edam:
  fixture: simple_constructs.yml
  operation: parse
  assertions:
    - path: [id]
      value: simple_constructs_y
    - path: [version]
      value: "1.0"
    - path: [description]
      value: Simple constructs
    - path: [edam_operations, "$length"]
      value: 2
    - path: [edam_operations, 0]
      value: operation_0004
    - path: [edam_topics, "$length"]
      value: 2
    - path: [edam_topics, 1]
      value: topic_3372
