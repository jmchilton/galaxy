# Requirements, containers, and stdio.
#
# These fields are Python-only for now: the TS ParsedTool schema does not carry
# requirements/containers/stdio, so these cases are not portable to a TS replay.

parse_package_requirement:
  fixture: composite_shapefile
  operation: parse
  assertions:
    - path: [requirements, {type: package}, name]
      value: fiona
    - path: [requirements, {type: package}, version]
      value: "1.8.6"

parse_docker_container:
  fixture: catDocker
  operation: parse
  assertions:
    - path: [containers, 0, type]
      value: docker
    - path: [containers, 0, container_id]
      value: busybox:1.36.1-glibc

parse_stdio_exit_codes:
  fixture: all_output_types
  operation: parse
  assertions:
    - path: [stdio, exit_codes, "$length"]
      value: 2
    - path: [stdio, exit_codes, 0, range_start]
      value: "-inf"
    - path: [stdio, exit_codes, 1, range_end]
      value: inf
