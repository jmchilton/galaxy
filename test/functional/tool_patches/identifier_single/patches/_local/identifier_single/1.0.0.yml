format_version: 1
kind: security
upstream:
  - repo: galaxyproject/galaxy
    pr: 1
    merge_commit: 0123456789abcdef0123456789abcdef01234567
reproducibility: unusual_inputs
reproducibility_doc: >-
  Jobs whose input identifier contained a dot now write it as an underscore.
  Other jobs are unchanged.
ops:
  - replace_text:
      path: command
      old: "echo 'identifier $input1.element_identifier' > 'output1';"
      new: |-
        #set $clean_identifier = $input1.element_identifier.replace(".", "_")
        echo 'identifier $clean_identifier' > 'output1';
      occurrences: 1
